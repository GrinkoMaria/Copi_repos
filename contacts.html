<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Учебная лаборатория веб-аналитики: страницы, переходы и события.">
  <title>Contacts — GA4 Lab</title>
  
  <!-- Подключаем ТОЛЬКО один скрипт -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

<header>
  <a class="brand" href="index.html">GA4<span>LAB</span></a>
  <nav aria-label="Основная навигация">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contacts.html" aria-current="page">Contacts</a>
  </nav>
</header>

<main>
  <p class="eyebrow">ОП.03 / ЛАБОРАТОРИЯ ВЕБ-АНАЛИТИКИ</p>
  <h1>Давайте<br><em>оставаться на связи.</em></h1>
  <p class="lead">Последняя остановка маршрута. Здесь можно проверить взаимодействие с учебной формой.</p>

  <!-- ФОРМА (action содержит ваш URL) -->
  <form id="lead-form" action="https://script.google.com/macros/s/AKfycbymGbO3ZxVQ8cH6fOHA1_c9sNoXMuA436Qz9VlRaRVFiaszir_PO8I5_Fh7CMdeBCazw/exec" method="POST" target="submission-frame">
    
    <label>Имя
      <input name="name" required maxlength="200" autocomplete="off" placeholder="Иван Тестов">
    </label>

    <label>Телефон
      <input name="phone" type="tel" required maxlength="200" autocomplete="off" placeholder="+7 (999) 123-45-67">
    </label>

    <label>Email
      <input name="email" type="email" maxlength="200" autocomplete="off" placeholder="student@example.com">
    </label>

    <label>Направление
      <select name="direction" required>
        <option value="">Выберите направление</option>
        <option value="frontend">Frontend</option>
        <option value="backend">Backend</option>
        <option value="data">Data</option>
      </select>
    </label>

    <label>Уровень
      <select name="level" required>
        <option value="">Выберите уровень</option>
        <option value="zero">С нуля</option>
        <option value="base">Базовый</option>
        <option value="advanced">Продолжающий</option>
      </select>
    </label>

    <label>Удобное время
      <select name="preferred_time" required>
        <option value="">Выберите время</option>
        <option value="weekday_evening">Будни вечером</option>
        <option value="weekend">Выходные</option>
      </select>
    </label>

    <!-- Скрытые поля -->
    <input type="hidden" name="request_id" id="request_id" value="">
    <input type="hidden" name="utm_source" id="utm_source" value="">
    <input type="hidden" name="utm_medium" id="utm_medium" value="">
    <input type="hidden" name="utm_campaign" id="utm_campaign" value="">
    <input type="hidden" name="utm_content" id="utm_content" value="">

    <!-- Кнопки -->
    <button class="button" type="submit">Отправить заявку <span>↗</span></button>
    <button type="reset">Новая заявка</button>
    
    <p id="form-status" role="status"></p>
    <small>Учебная форма: используйте только вымышленные имя и email.</small>
  </form>

  <!-- Скрытая рамка для ответа Apps Script (обязательно после формы) -->
  <iframe name="submission-frame" id="submission-frame" hidden title="Ответ приемщика заявок"></iframe>

</main>

<footer>
  <p>GA4 Lab — Учебный сайт</p>
  <p>HTML / CSS / JavaScript</p>
</footer>

</body>
</html>
